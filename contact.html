<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <style>
        body {
            background-color: #E6E2DD; /* Off-white background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial Black', Gadget, sans-serif;
        }

        .container {
            width: 600px;
            position: relative;
        }

        .header-section {
            display: flex;
            align-items: flex-end;
            margin-bottom: -10px;
            margin-left: 20px;
        }

        h1 {
            font-size: 3rem;
            margin: 0;
            padding: 0;
        }

        .bunny-icon {
            width: 80px;
            margin-left: 20px;
            opacity: 0.7;
        }

        .form-box {
            background-color: #2D2D2D; /* Dark charcoal */
            padding: 40px;
            display: flex;
            gap: 30px;
            color: white;
        }

        .left-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            border-bottom: 2px solid white;
            display: flex;
            align-items: baseline;
        }

        .input-group label {
            font-size: 1.2rem;
            text-decoration: underline;
            margin-right: 10px;
        }

        input {
            background: transparent;
            border: none;
            color: white;
            font-family: inherit;
            font-size: 1rem;
            width: 100%;
            outline: none;
            padding: 5px;
        }

        .right-column {
            flex: 1;
            background-color: #D1D1D1;
            padding: 20px;
            position: relative;
        }

        .right-column label {
            color: #2D2D2D;
            font-size: 1.2rem;
            display: block;
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: transparent;
            border: none;
            resize: none;
            outline: none;
            font-family: inherit;
        }

        .footer-row {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
        }

        #sendBtn {
            background-color: white;
            color: black;
            border: none;
            padding: 10px 25px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .circle {
            width: 40px;
            height: 40px;
            background-color: #D1D1D1;
            border-radius: 50%;
        }

        /* State for when button is pressed */
        #sendBtn.sent {
            background-color: #FFB6C1; /* Pink */
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <h1>Contact</h1>
        <svg class="bunny-icon" viewBox="0 0 100 100" fill="#A8948D">
            <path d="M30 10 Q30 40 40 40 Q50 40 50 10 Q50 0 40 0 Q30 0 30 10" />
            <path d="M60 10 Q60 40 70 40 Q80 40 80 10 Q80 0 70 0 Q60 0 60 10" />
            <rect x="35" y="40" width="40" height="30" rx="5" />
            <rect x="38" y="45" width="12" height="10" fill="none" stroke="black" stroke-width="2"/>
            <rect x="58" y="45" width="12" height="10" fill="none" stroke="black" stroke-width="2"/>
            <line x1="50" y1="50" x2="58" y2="50" stroke="black" stroke-width="2" />
        </svg>
    </div>

    <div class="form-box">
        <div class="left-column">
            <div class="input-group">
                <label>Name</label>
                <input type="text" id="name">
            </div>
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email">
            </div>
            <div class="input-group">
                <label>Subject</label>
                <input type="text" id="subject">
            </div>
            
            <div class="footer-row">
                <button id="sendBtn" onclick="handleSend()">SEND</button>
                <div class="circle"></div>
                <div class="circle"></div>
                <div class="circle"></div>
            </div>
        </div>

        <div class="right-column">
            <label>Message</label>
            <textarea id="message"></textarea>
        </div>
    </div>
</div>

<script>
    function handleSend() {
        const btn = document.getElementById('sendBtn');
        
        // Change text and add pink class
        btn.innerText = "Sent";
        btn.classList.add('sent');

        // Revert after 5 seconds
        setTimeout(() => {
            btn.innerText = "SEND";
            btn.classList.remove('sent');
        }, 5000);
    }
</script>

</body>
</html>
