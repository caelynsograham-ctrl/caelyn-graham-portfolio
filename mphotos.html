
<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body {
            background-color: #f2ede9;
            margin: 0;
            padding: 40px;
            font-family: sans-serif;
        }

        /* Sticky Rabbit */
        .rabbit-sticky {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 90px;
            z-index: 100;
            transition: transform 0.3s ease;
        }

        .rabbit-sticky:hover {
            transform: scale(1.1);
        }

        /* The Main Collage Grid */
        .collage-container {
          
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 1300px;
            margin: 0 auto;
        }

        /* Image Styling */
        .collage-container img {
        
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Right Side Sub-Grid */
        .right-column {
            display: grid;
            grid-template-rows: auto auto auto;
            gap: 15px;
        }

        .top-right-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .bottom-right-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
       .back-button {
        position: fixed;
        top: 870px;
        left: 1400px;
        z-index: 100;

        background-color: #D97388;
        color: #2B2B2B;

        font-family: 'Unbounded', sans-serif;
        font-weight: 900;
        font-size: 18px;

        padding: 12px 18px;
        text-decoration: none;

        border-radius: 6px;

        transition: transform 0.2s ease, opacity 0.2s ease;
      }

      .back-button:hover {
        transform: scale(1.08);
        background-color: white;
          
      }
      /* =========================================
   TABLET RESPONSIVE
========================================= */
@media (max-width: 1024px) {

  body {
    padding: 25px;
  }

  .rabbit-sticky {
    width: 70px;
    top: 15px;
    right: 15px;
  }

  .collage-container {
    width: 100%;
    grid-template-columns: 1fr;
    gap: 20px;
  }

  .right-column {
    gap: 20px;
  }

  .top-right-grid,
  .bottom-right-grid {
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  .collage-container img {
    width: 100%;
    height: auto;
    object-fit: cover;
    border-radius: 8px;
  }

  .back-button {
    top: auto;
    left: auto;
    bottom: 20px;
    right: 20px;

    font-size: 15px;
    padding: 10px 14px;
  }
}


/* =========================================
   MOBILE RESPONSIVE
========================================= */
@media (max-width: 768px) {

  body {
    padding: 18px;
  }

  .rabbit-sticky {
    width: 55px;
    top: 10px;
    right: 10px;
  }

  .collage-container {
    width: 100%;
    gap: 15px;
  }

  .right-column {
    gap: 15px;
  }

  .top-right-grid,
  .bottom-right-grid {
    grid-template-columns: 1fr;
    gap: 15px;
  }

  .collage-container img {
    width: 100%;
    height: auto;
    border-radius: 8px;
  }

  .back-button {
    bottom: 15px;
    right: 15px;

    font-size: 12px;
    padding: 8px 12px;
  }
}
    </style>
</head>

<body>

    <!-- Sticky Logo Button -->
    <div class="rabbit-sticky">
        <a href="nav.html">
            <img src="Graham_logo.png" alt="Logo" style="width:100%">
        </a>
    </div>
    <a href="magazine.html" class="back-button">BACK</a>

    <!-- Collage -->
    <div class="collage-container">
        
        <div class="left-column">
            <img src="magimages/cool.png" alt="Person sitting in aisle">
        </div>

        <div class="right-column">
            
            <div class="top-right-grid">
                <img src="magimages/ramen.png" alt="Snack shelf">
                <img src="magimages/cap.png" alt="Person with hat">
            </div>

            <div class="middle-row">
                <img src="magimages/soda.png" alt="Coca Cola cans">
            </div>

            <div class="bottom-right-grid">
                <img src="magimages/snacks.png" alt="Girl with snacks">
                <img src="magimages/walk.png" alt="Person walking">
            </div>

        </div>

    </div>

</body>
</html>
